name: Windows ビルド (PitchLuna.exe)

on:
  workflow_dispatch:
  push:
    branches: ["release"]          # release ブランチに置くとビルドが始まる
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PIP_NO_CACHE_DIR: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリを入れる (グラボ対応の torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu128
          python -m pip install demucs torchcrepe librosa soundfile sounddevice pygame numpy scipy pyinstaller
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

      - name: ビルド
        run: |
          python build/gen_deps.py
          python -m PyInstaller build/PitchLuna.spec --noconfirm --distpath dist --workpath work
          Remove-Item -Recurse -Force work

      - name: 仕上げ (本体の .py・フォント・取扱説明書を入れる)
        id: asm
        run: python build/assemble.py dist/PitchLuna

      - name: 動作テスト (ライブラリの読み込み・短い曲の解析・画面)
        run: |
          $dir = "${{ steps.asm.outputs.dir }}"
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process -FilePath "$dir\PitchLuna.exe" -ArgumentList "--selftest" -WorkingDirectory $dir -Wait -PassThru
          Get-Content "$dir\selftest_result.json" -Encoding UTF8
          if (Test-Path "$dir\pitchluna_log.txt") { Get-Content "$dir\pitchluna_log.txt" -Encoding UTF8 -Tail 80 }
          Remove-Item -Recurse -Force "$dir\_selftest" -ErrorAction SilentlyContinue
          Remove-Item -Force "$dir\pitchluna_log.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "動作テストに失敗しました (exit $($p.ExitCode))" }
          Move-Item "$dir\selftest_result.json" "selftest_result.json"

      - name: 結果をアップロード (ZIP でダウンロードできます)
        uses: actions/upload-artifact@v4
        with:
          name: PitchLuna-${{ steps.asm.outputs.version }}-windows
          path: ${{ steps.asm.outputs.dir }}
          retention-days: 90
          compression-level: 6

      - name: 動作テストの結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-result
          path: |
            selftest_result.json
            dist/**/selftest_result.json
            dist/**/pitchluna_log.txt
          if-no-files-found: ignore
