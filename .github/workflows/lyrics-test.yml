name: 歌詞の部品の動作確認 (ビルド版にアップデートを重ねて試す)

on:
  workflow_dispatch:
  push:
    branches: ["lyrics-test"]

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: 今配っているビルド版を受け取る
        uses: actions/download-artifact@v4
        with:
          name: PitchLuna-1.1.0-windows
          path: app
          run-id: 38661019785
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: アップデートで入れ替わるファイルを重ねる (ヘルプ → アップデート と同じ状態)
        shell: python
        run: |
          import json, shutil, os
          m = json.load(open("version.json", encoding="utf-8"))
          for rel in m["files"]:
              dst = os.path.join("app", rel)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copy2(rel, dst)
          shutil.copy2("version.json", "app/version.json")
          print(len(m["files"]), "files")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: テスト用の声 (Whisper のテスト用の英語の音声) を WAV にする
        shell: python
        run: |
          import subprocess, sys, urllib.request
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "soundfile", "numpy"])
          import soundfile as sf
          urllib.request.urlretrieve("https://github.com/openai/whisper/raw/main/tests/jfk.flac", "jfk.flac")
          y, sr = sf.read("jfk.flac")
          sf.write("test.wav", y, sr, subtype="PCM_16")
          print(len(y) / sr, "sec", sr)

      - name: 歌詞の動作確認 (PitchLuna.exe --lyrics-selftest)
        shell: powershell
        run: |
          $p = Start-Process -FilePath "app\PitchLuna.exe" -ArgumentList "--lyrics-selftest", "$pwd\test.wav" -WorkingDirectory "app" -Wait -PassThru
          if (Test-Path app\lyrics_selftest.json) { Get-Content app\lyrics_selftest.json -Encoding UTF8 }
          if (Test-Path app\pitchluna_log.txt) { Get-Content app\pitchluna_log.txt -Encoding UTF8 -Tail 120 }
          if ($p.ExitCode -ne 0) { throw "歌詞の動作確認に失敗 (exit $($p.ExitCode))" }

      - name: 結果を注釈に出す (ログを開かなくても見られるように)
        if: always()
        shell: python
        run: |
          import json, os
          p = "app/lyrics_selftest.json"
          if os.path.exists(p):
              d = json.load(open(p, encoding="utf-8"))
              for st in d["steps"]:
                  msg = (st.get("info") or st.get("error", "")) + ("\n" + st["trace"] if st.get("trace") else "")
                  msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:3000]
                  print(f"::notice title={'OK' if st['ok'] else 'NG'} {st['name']}::{msg}")
          else:
              lg = "app/pitchluna_log.txt"
              t = open(lg, encoding="utf-8", errors="replace").read()[-3000:] if os.path.exists(lg) else "no log"
              print("::notice title=no result::" + t.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))

      - name: 結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-selftest
          path: |
            app/lyrics_selftest.json
            app/pitchluna_log.txt
          if-no-files-found: ignore
